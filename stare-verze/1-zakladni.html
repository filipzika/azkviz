<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexkvíz</title>
<style>
  :root {
    --bg1: #0d1b3a;
    --bg2: #1d3b7a;
    --empty: #e9edf5;
    --empty-stroke: #9aa7c2;
    --text: #fff;
    --black: #2a2a2e;
    --t1: #f28c1b;
    --t2: #2f7de1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at center, var(--bg2), var(--bg1) 75%);
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; user-select: none;
  }
  header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px; gap: 16px;
  }
  .team {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-radius: 14px; background: rgba(255,255,255,.07);
    border: 3px solid transparent; transition: .2s; min-width: 260px;
  }
  .team.active { border-color: #fff; box-shadow: 0 0 24px rgba(255,255,255,.35); }
  .team .dot { width: 28px; height: 28px; border-radius: 50%; flex: none; }
  .team input[type=text] {
    background: transparent; border: none; color: #fff; font-size: 24px; font-weight: 700;
    width: 160px; outline: none;
  }
  .team .score { font-size: 28px; font-weight: 800; margin-left: auto; }
  .team input[type=color] { width: 28px; height: 28px; border: none; padding: 0; background: none; cursor: pointer; }
  .center { text-align: center; }
  .center h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .turn { font-size: 15px; opacity: .85; }
  main { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  svg { height: 100%; max-height: calc(100vh - 150px); width: auto; max-width: 96vw; }
  .hex { cursor: pointer; }
  .hex polygon { transition: fill .25s, transform .15s; stroke-width: 4; }
  .hex:hover polygon { filter: brightness(1.08); }
  .hex text { font-size: 34px; font-weight: 800; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  .hex.win polygon { stroke: #ffe24a; stroke-width: 8; }
  footer { padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 15px; padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff;
  }
  button:hover { background: rgba(255,255,255,.22); }
  .menu {
    position: fixed; display: none; flex-direction: column; gap: 6px; padding: 10px;
    background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); z-index: 10; min-width: 190px;
  }
  .menu.open { display: flex; }
  .menu .title { color: #333; font-weight: 700; text-align: center; padding-bottom: 4px; }
  .menu button { color: #fff; font-weight: 700; font-size: 17px; padding: 10px 14px; text-align: left; }
  .menu button kbd { float: right; opacity: .7; font-family: inherit; }
  .menu .m-clear { background: #ccd3e0; color: #333; }
  .banner {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,.55); z-index: 20; gap: 18px;
  }
  .banner.open { display: flex; }
  .banner h2 { font-size: 64px; margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  .help { font-size: 13px; opacity: .6; }
</style>
</head>
<body>
<header>
  <div class="team" id="team1">
    <input type="color" id="c1" value="#f28c1b" title="Barva týmu">
    <input type="text" id="n1" value="Tým 1">
    <span class="score" id="s1">0</span>
  </div>
  <div class="center">
    <h1>HEXKVÍZ</h1>
    <div class="turn" id="turn"></div>
  </div>
  <div class="team" id="team2">
    <input type="color" id="c2" value="#2f7de1" title="Barva týmu">
    <input type="text" id="n2" value="Tým 2">
    <span class="score" id="s2">0</span>
  </div>
</header>

<main><svg id="board"></svg></main>

<footer>
  <button id="swap">Přepnout tah (Mezerník)</button>
  <button id="undo">Zpět (Ctrl+Z)</button>
  <button id="reset">Nová hra</button>
  <button id="fs">Celá obrazovka (F)</button>
  <span class="help">Klikni na pole → vyber tým (1 / 2), 3 = černé (špatná odpověď), 0 = vymazat, Esc = zavřít</span>
</footer>

<div class="menu" id="menu">
  <div class="title" id="menuTitle"></div>
  <button class="m-t1" data-v="1">Tým 1 <kbd>1</kbd></button>
  <button class="m-t2" data-v="2">Tým 2 <kbd>2</kbd></button>
  <button class="m-black" data-v="3" style="background:var(--black)">Černé pole <kbd>3</kbd></button>
  <button class="m-clear" data-v="0">Vymazat <kbd>0</kbd></button>
</div>

<div class="banner" id="banner">
  <h2 id="winText"></h2>
  <div style="display:flex;gap:10px">
    <button id="bannerClose">Zobrazit desku</button>
    <button id="bannerNew">Nová hra</button>
  </div>
</div>

<script>
const ROWS = 7;
const SIZE = 58;                       // poloměr hexagonu
const W = Math.sqrt(3) * SIZE;         // šířka
const VS = SIZE * 1.5;                 // vertikální rozestup
const STORE = 'hexkviz-state-v1';

// --- pole: id 1..28, řádek r (0..6), pozice c (0..r)
const cells = [];
for (let r = 0, id = 1; r < ROWS; r++)
  for (let c = 0; c <= r; c++) cells.push({ id: id++, r, c });
const idx = (r, c) => (r < 0 || r >= ROWS || c < 0 || c > r) ? -1 : r * (r + 1) / 2 + c;
const neighbors = cells.map(({ r, c }) =>
  [[r, c - 1], [r, c + 1], [r - 1, c - 1], [r - 1, c], [r + 1, c], [r + 1, c + 1]]
    .map(([a, b]) => idx(a, b)).filter(i => i >= 0));
const sides = ({ r, c }) => ({ L: c === 0, R: c === r, B: r === ROWS - 1 });

// --- stav
let state = { owner: Array(cells.length).fill(0), turn: 1, n1: 'Tým 1', n2: 'Tým 2', c1: '#f28c1b', c2: '#2f7de1' };
let history = [];
let winner = 0, winSet = new Set();
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.owner?.length === cells.length) state = { ...state, ...s }; } catch {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

// --- kreslení
const svg = document.getElementById('board');
const pad = 12;
const width = ROWS * W + pad * 2, height = (ROWS - 1) * VS + SIZE * 2 + pad * 2;
svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
const hexPts = (cx, cy) => Array.from({ length: 6 }, (_, k) => {
  const a = Math.PI / 180 * (60 * k - 90);
  return `${cx + (SIZE - 3) * Math.cos(a)},${cy + (SIZE - 3) * Math.sin(a)}`;
}).join(' ');
const els = cells.map((cell, i) => {
  const cx = width / 2 + (cell.c - cell.r / 2) * W;
  const cy = pad + SIZE + cell.r * VS;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.classList.add('hex');
  g.innerHTML = `<polygon points="${hexPts(cx, cy)}"/><text x="${cx}" y="${cy}">${cell.id}</text>`;
  g.addEventListener('click', e => openMenu(i, e));
  svg.appendChild(g);
  return g;
});

function colorOf(v) {
  return v === 1 ? state.c1 : v === 2 ? state.c2 : v === 3 ? getComputedStyle(document.documentElement).getPropertyValue('--black') : null;
}

function render() {
  checkWin();
  els.forEach((g, i) => {
    const v = state.owner[i];
    const p = g.querySelector('polygon'), t = g.querySelector('text');
    p.setAttribute('fill', v ? colorOf(v) : 'var(--empty)');
    p.setAttribute('stroke', v ? 'rgba(255,255,255,.85)' : 'var(--empty-stroke)');
    t.setAttribute('fill', v ? '#fff' : '#1d2b4f');
    g.classList.toggle('win', winSet.has(i));
  });
  document.documentElement.style.setProperty('--t1', state.c1);
  document.documentElement.style.setProperty('--t2', state.c2);
  n1.value = state.n1; n2.value = state.n2; c1.value = state.c1; c2.value = state.c2;
  team1.style.background = hexA(state.c1, .25); team2.style.background = hexA(state.c2, .25);
  s1.textContent = state.owner.filter(v => v === 1).length;
  s2.textContent = state.owner.filter(v => v === 2).length;
  team1.classList.toggle('active', state.turn === 1 && !winner);
  team2.classList.toggle('active', state.turn === 2 && !winner);
  turn.textContent = winner ? `Vítěz: ${state['n' + winner]}` : `Na tahu: ${state['n' + state.turn]}`;
  document.querySelector('.m-t1').style.background = state.c1;
  document.querySelector('.m-t2').style.background = state.c2;
  document.querySelector('.m-t1').firstChild.textContent = state.n1 + ' ';
  document.querySelector('.m-t2').firstChild.textContent = state.n2 + ' ';
  save();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

// --- výhra: souvislá skupina týmu dotýkající se všech tří stran
function checkWin() {
  winner = 0; winSet = new Set();
  for (const team of [1, 2]) {
    const seen = new Set();
    for (let i = 0; i < cells.length; i++) {
      if (state.owner[i] !== team || seen.has(i)) continue;
      const comp = [], stack = [i]; seen.add(i);
      let L = false, R = false, B = false;
      while (stack.length) {
        const j = stack.pop(); comp.push(j);
        const s = sides(cells[j]); L ||= s.L; R ||= s.R; B ||= s.B;
        for (const k of neighbors[j]) if (!seen.has(k) && state.owner[k] === team) { seen.add(k); stack.push(k); }
      }
      if (L && R && B) { winner = team; comp.forEach(j => winSet.add(j)); }
    }
    if (winner) return;
  }
}

// --- menu
const menu = document.getElementById('menu');
let menuCell = -1;
function openMenu(i, e) {
  menuCell = i;
  menuTitle.textContent = `Pole ${cells[i].id}`;
  menu.classList.add('open');
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(e.clientX + 12, innerWidth - mw - 8) + 'px';
  menu.style.top = Math.min(e.clientY - mh / 2, innerHeight - mh - 8) + 'px';
  menu.style.top = Math.max(8, parseFloat(menu.style.top)) + 'px';
}
function closeMenu() { menu.classList.remove('open'); menuCell = -1; }
function assign(v) {
  if (menuCell < 0) return;
  const i = menuCell; closeMenu();
  if (state.owner[i] === v) return;
  const prevWinner = winner;
  history.push(JSON.stringify(state));
  state.owner[i] = v;
  if (v === 1 || v === 2) state.turn = v === 1 ? 2 : 1;
  else if (v === 3) state.turn = state.turn === 1 ? 2 : 1;
  render();
  if (winner && !prevWinner) showWin();
}
menu.addEventListener('click', e => { const b = e.target.closest('button'); if (b) assign(+b.dataset.v); });
document.addEventListener('mousedown', e => { if (!menu.contains(e.target) && !e.target.closest('.hex')) closeMenu(); });

function showWin() {
  winText.textContent = `🏆 Vyhrává ${state['n' + winner]}!`;
  winText.style.color = colorOf(winner);
  banner.classList.add('open');
}
bannerClose.onclick = () => banner.classList.remove('open');
bannerNew.onclick = () => { banner.classList.remove('open'); newGame(); };

// --- ovládání
function undo() { if (history.length) { state = JSON.parse(history.pop()); render(); } }
function newGame() {
  if (state.owner.some(v => v) && !confirm('Opravdu začít novou hru?')) return;
  history.push(JSON.stringify(state));
  state.owner = Array(cells.length).fill(0); state.turn = 1; render();
}
swap.onclick = () => { state.turn = state.turn === 1 ? 2 : 1; render(); };
document.getElementById('undo').onclick = undo;
reset.onclick = newGame;
const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
fs.onclick = toggleFs;
n1.oninput = () => { state.n1 = n1.value || 'Tým 1'; render(); };
n2.oninput = () => { state.n2 = n2.value || 'Tým 2'; render(); };
c1.oninput = () => { state.c1 = c1.value; render(); };
c2.oninput = () => { state.c2 = c2.value; render(); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (menuCell >= 0 && ['0', '1', '2', '3'].includes(e.key)) { assign(+e.key); return; }
  if (e.key === 'Escape') { closeMenu(); banner.classList.remove('open'); }
  if (e.key === ' ') { e.preventDefault(); swap.click(); }
  if (e.key.toLowerCase() === 'f') toggleFs();
});

render();
</script>
</body>
</html>
